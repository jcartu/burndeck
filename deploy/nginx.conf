# Reverse proxy for the Burndeck dashboard.
#
# Place a TLS terminator in front of this -- certbot, caddy or Cloudflare --
# and have it proxy to the vhost below. The app binds 127.0.0.1:8801 by
# default; change the upstream to match if you moved it.
#
# CRITICAL: /api/stream is a Server-Sent Events endpoint. proxy_buffering and
# proxy_cache MUST stay off there, or nginx will hold the stream until its
# buffer fills and the live tiles will freeze. Do not "optimise" that block.

upstream burndeck {
    server 127.0.0.1:8801;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    # Compression for cacheable static assets and API JSON. Disabled per-location
    # on the SSE stream below.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # Server-Sent Events stream. No buffering, no caching, long timeout.
    location = /api/stream {
        proxy_pass http://burndeck;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        gzip off;
    }

    # Theme shaders / runner JS: stable, buffered, cache-friendly.
    location /static/themes/ {
        proxy_pass http://burndeck;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering on;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Everything else: HTML shell, REST API, login flow.
    location / {
        proxy_pass http://burndeck;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
