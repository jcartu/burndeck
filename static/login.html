<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030811">
<link rel="manifest" href="static/manifest.webmanifest">
<title>burndeck · access</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --accent:#57c8ff;
  --accent2:#ffc96b;
  --accent-rgb:87,200,255;
  --void:#030811;
  --text:#e8f2fa;
  --muted:#8a99a8;
  --crit:#ff4d68;
  --panel:rgba(8,16,30,0.6);
  --line:rgba(255,255,255,.1);
  --radius:16px;
  --glow:1;
  --font-display:system-ui,sans-serif;
  --font-head:system-ui,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  background:var(--void);color:var(--text);font-family:var(--font-mono);
  min-height:100%;overflow-x:hidden;overflow-y:auto;
  display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  transition:background-color .6s;
}
#wp{position:fixed;inset:0;z-index:0;width:100vw;height:100vh}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 0%,rgba(0,0,0,0.4) 72%,rgba(0,0,0,0.75) 100%)}
body.light .vig{background:radial-gradient(ellipse at 50% 42%,transparent 0%,rgba(255,255,255,0.16) 75%,rgba(185,200,210,0.4) 100%)}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,0.09) 2px 4px)}
body.light .scan{opacity:.1}

.card{
  position:relative;z-index:5;width:min(430px,92vw);
  background:var(--panel);backdrop-filter:blur(24px) saturate(1.35);-webkit-backdrop-filter:blur(24px) saturate(1.35);
  border:1px solid rgba(var(--accent-rgb),0.28);border-radius:var(--radius);
  padding:clamp(22px,6vw,34px) clamp(20px,7vw,36px) clamp(18px,5vw,26px);
  box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 60px rgba(var(--accent-rgb),calc(.14*var(--glow)));
  animation:cardin 1s cubic-bezier(.2,.9,.3,1.08) both .15s;
}
@keyframes cardin{from{opacity:0;transform:translateY(30px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.tick{position:absolute;width:18px;height:18px;pointer-events:none;transition:all .4s}
.tick.tl{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);border-top-left-radius:var(--radius);filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),calc(.9*var(--glow))))}
.tick.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);border-bottom-right-radius:var(--radius);filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),calc(.9*var(--glow))))}

.title{font-family:var(--font-display);font-weight:800;font-size:1.55rem;letter-spacing:.16em;line-height:1.15;
  color:var(--text);text-shadow:0 0 22px rgba(var(--accent-rgb),calc(.55*var(--glow)))}
.title em{font-style:normal;color:var(--accent)}
.sub{font-size:.56rem;letter-spacing:.34em;color:var(--muted);margin:8px 0 18px;text-transform:uppercase}

#boot{font-size:.62rem;line-height:1.75;color:var(--muted);letter-spacing:.06em;min-height:74px;
  border:1px solid var(--line);border-radius:calc(var(--radius)*.5);
  background:rgba(0,0,0,.22);padding:9px 12px;margin-bottom:20px;white-space:pre-wrap}
body.light #boot{background:rgba(255,255,255,.3)}
#boot .ok{color:var(--accent)}
#boot .cursor{display:inline-block;width:7px;height:11px;background:var(--accent);vertical-align:-1px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.themeline{display:flex;align-items:center;gap:8px;font-size:.56rem;letter-spacing:.26em;color:var(--muted);margin-bottom:18px;text-transform:uppercase;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.themeline b{color:var(--accent);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

label{display:block;font-family:var(--font-head);font-weight:600;font-size:.6rem;
  letter-spacing:.32em;color:var(--muted);margin:0 0 7px 2px;text-transform:uppercase}
input{
  width:100%;background:rgba(var(--accent-rgb),0.05);border:1px solid rgba(var(--accent-rgb),0.24);
  color:var(--text);font-family:var(--font-mono);font-size:1rem;letter-spacing:.06em;
  padding:12px 14px;margin-bottom:17px;outline:none;transition:all .25s;border-radius:calc(var(--radius)*.5);
}
input:focus{border-color:var(--accent);background:rgba(var(--accent-rgb),0.1);
  box-shadow:0 0 24px rgba(var(--accent-rgb),calc(.25*var(--glow)))}
button{
  width:100%;margin-top:4px;padding:14px;cursor:pointer;
  font-family:var(--font-display);font-weight:700;font-size:.78rem;letter-spacing:.34em;text-indent:.34em;
  color:var(--void);background:linear-gradient(100deg,var(--accent),var(--accent2));
  border:none;border-radius:calc(var(--radius)*.5);transition:all .25s;text-transform:uppercase;
}
button:hover{filter:brightness(1.12);box-shadow:0 0 34px rgba(var(--accent-rgb),calc(.5*var(--glow)));transform:translateY(-1px)}
button:active{transform:scale(.98)}
button:disabled{opacity:.65;cursor:wait}
#err{min-height:20px;margin-top:13px;text-align:center;font-family:var(--font-head);font-weight:700;
  font-size:.68rem;letter-spacing:.3em;color:var(--crit);opacity:0;transition:opacity .3s;text-transform:uppercase}
#err.on{opacity:1}
.foot{margin-top:18px;text-align:center;font-size:.52rem;letter-spacing:.24em;color:var(--muted);opacity:.8}
.foot.dedication{margin-top:7px;opacity:.95}
.foot .heart{color:var(--crit)}
.card.deny{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;
  font-size:.55rem;letter-spacing:.3em;color:var(--muted);opacity:.65;text-transform:uppercase;text-align:center;white-space:nowrap}
.hint b{color:var(--accent)}
.hint .on-touch{display:none}
@media(pointer:coarse){.hint .no-touch{display:none}.hint .on-touch{display:inline}}
body.light{--panel:rgba(255,253,248,0.66)}
body.light input{color:#141c24}
body.light button{color:#f8f5ee}
</style>
</head>
<body>
<canvas id="wp"></canvas>
<div class="vig"></div>
<div class="scan"></div>

<div class="card" id="card">
  <span class="tick tl"></span><span class="tick br"></span>
  <div class="title" id="t-title">burn<em>deck</em></div>
  <div class="sub" id="t-sub">GPU TELEMETRY · SECURE ACCESS</div>
  <div id="boot"><span class="cursor"></span></div>
  <div class="themeline"><span class="dot"></span> INTERFACE: <b id="t-name">—</b></div>
  <form id="f" autocomplete="off">
    <label for="u" id="t-user">Operator ID</label>
    <input id="u" name="login" type="text" autocapitalize="none" autocorrect="off" autofocus>
    <label for="p" id="t-pass">Access Key</label>
    <input id="p" name="password" type="password">
    <button id="go" type="submit">Engage</button>
  </form>
  <div id="err"></div>
  <div class="foot" id="t-foot">unauthorized access is monitored</div>
  <div class="foot dedication">built with <span class="heart">♥</span> for the RTX6KPro Discord Family</div>
</div>
<div class="hint"><span class="no-touch">press <b>W</b> to shift interface</span><span class="on-touch">tap <b>interface</b> to shift</span></div>

<script src="static/themes/runner.js?v=20260811c"></script>
<script>
const ASSET_VER = '20260811c';
const THEME_ORDER = ['oblivion','ares','k2049','muthur','jarvis','nightcity','arrakis','lumon','apex','construct','gargantua','thegrid','tokyo'];
const hexRgb = (h) => [0,2,4].map(i=>parseInt(h.replace('#','').slice(i,i+2),16)).join(',');
let runner = null, bootTimer = null, currentId = null;

function loadFonts(fams){
  if (!fams || !fams.length) return;
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?' + fams.map(f=>'family='+f).join('&') + '&display=swap';
  document.head.appendChild(l);
}

function applyLoginTheme(th){
  const t = th.theme || {}, lg = th.login || {};
  const rs = document.documentElement.style;
  const set = (k,v) => v && rs.setProperty(k,v);
  set('--accent', t.accent); t.accent && rs.setProperty('--accent-rgb', hexRgb(t.accent));
  set('--accent2', t.accent2);
  set('--void', t.void); set('--text', t.text); set('--muted', t.muted);
  set('--panel', t.panel); set('--line', t.line); set('--radius', t.radius);
  set('--crit', t.crit);
  rs.setProperty('--glow', t.light ? '0.25' : '1');
  document.body.classList.toggle('light', !!t.light);
  loadFonts(t.googleFonts);
  const fonts = t.fonts || {};
  set('--font-display', fonts.display); set('--font-head', fonts.head); set('--font-mono', fonts.mono);
  document.getElementById('t-title').textContent = lg.title || 'burndeck';
  document.getElementById('t-sub').textContent = lg.sub || 'GPU TELEMETRY';
  document.getElementById('t-name').textContent = th.name || '';
  document.getElementById('t-user').textContent = lg.user || 'Operator ID';
  document.getElementById('t-pass').textContent = lg.pass || 'Access Key';
  document.getElementById('go').textContent = lg.button || 'Engage';
  document.getElementById('t-foot').textContent = lg.footer || 'unauthorized access is monitored';
  // typed boot log
  const boot = document.getElementById('boot');
  if (bootTimer) { clearInterval(bootTimer); bootTimer = null; }
  const lines = lg.boot || [];
  boot.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  bootTimer = setInterval(() => {
    if (i >= lines.length){ clearInterval(bootTimer); bootTimer = null; return; }
    const cur = boot.querySelector('.cursor');
    const div = document.createElement('div');
    div.innerHTML = lines[i].replace(/\bOK\b/g, '<span class="ok">OK</span>');
    boot.insertBefore(div, cur);
    i++;
  }, 420);
}

function showTheme(id){
  const th = (window.BDTHEMES || {})[id];
  if (!th || !window.WallpaperRunner) return false;
  applyLoginTheme(th);
  try {
    if (runner) runner.destroySoft();
    runner = new WallpaperRunner(document.getElementById('wp'), th.frag, Object.assign({ scale: 0.85 }, th.perf || {}));
    runner.start();
  } catch(e){ /* themed gradient card still works */ }
  currentId = id;
  try { localStorage.setItem('burndeck-theme', id); } catch(e){}
  return true;
}

const loaded = new Set();
function loadThemeScript(id, cb){
  if (loaded.has(id)) return cb();
  const s = document.createElement('script');
  s.src = 'static/themes/' + id + '.js?v=' + ASSET_VER;
  s.onload = () => { loaded.add(id); cb(); };
  s.onerror = () => cb();
  document.body.appendChild(s);
}

(function init(){
  let id = 'jarvis';
  try {
    const saved = localStorage.getItem('burndeck-theme');
    if (saved && THEME_ORDER.includes(saved)) id = saved;
  } catch(e){}
  loadThemeScript(id, () => showTheme(id));
})();

/* W (desktop) or tapping the INTERFACE line (touch) previews the next theme */
function shiftNext(){
  const i = (THEME_ORDER.indexOf(currentId) + 1) % THEME_ORDER.length;
  const next = THEME_ORDER[i];
  loadThemeScript(next, () => showTheme(next));
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === 'w' || e.key === 'W') shiftNext();
});
document.querySelector('.themeline').addEventListener('click', shiftNext);
document.addEventListener('pointermove', e => {
  if (runner) runner.setMouse(e.clientX/innerWidth - 0.5, e.clientY/innerHeight - 0.5);
});

/* ── auth ── */
const f = document.getElementById('f'), err = document.getElementById('err'),
      go = document.getElementById('go'), card = document.getElementById('card');
f.addEventListener('submit', async e => {
  e.preventDefault();
  const lg = ((window.BDTHEMES||{})[currentId]||{}).login || {};
  err.classList.remove('on');
  go.disabled = true; go.textContent = 'LINKING…';
  if (runner) runner.pulse(1);
  try {
    const r = await fetch('api/auth', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ login: document.getElementById('u').value.trim(),
                             password: document.getElementById('p').value })
    });
    if (r.ok){
      go.textContent = lg.granted || 'ACCESS GRANTED';
      if (runner) runner.pulse(1);
      const q = new URLSearchParams(location.search);
      const dest = q.get('redirect') || '/';
      setTimeout(() => location.href = dest.startsWith('/') ? dest : '/', 650);
      return;
    }
    err.textContent = '⨯ ' + (r.status === 401 ? (lg.denied || 'ACCESS DENIED') : 'UPLINK ERROR');
  } catch(_){ err.textContent = '⨯ CONNECTION ERROR'; }
  err.classList.add('on');
  card.classList.remove('deny'); void card.offsetWidth; card.classList.add('deny');
  document.getElementById('p').value = '';
  document.getElementById('p').focus();
  go.disabled = false; go.textContent = lg.button || 'ENGAGE';
});
</script>
</body>
</html>
