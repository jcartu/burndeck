<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:fixed;inset:0;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="runner.js"></script>
<script>
/* Harness: test.html?wp=<id>[&energy=0.8][&mx=0.3&my=-0.2]
   Exposes window.__WP_STATUS ('ok' | 'error: ...') and window.__LUMA (center-region avg luminance 0..1) */
const q = new URLSearchParams(location.search);
const id = q.get('wp');
const s = document.createElement('script');
s.src = id + '.js?cb=' + Date.now();
s.onload = () => {
  try {
    const wp = (window.BDTHEMES || {})[id];
    if (!wp){ window.__WP_STATUS = 'error: not registered under id ' + id; return; }
    const r = new WallpaperRunner(document.getElementById('c'), wp.frag, { preserve:true });
    if (q.get('energy')) setInterval(() => r.pulse(parseFloat(q.get('energy'))), 300);
    r.setMouse(parseFloat(q.get('mx') || '0'), parseFloat(q.get('my') || '0'));
    r.start();
    window.__RUNNER = r;
    window.__THEME = wp;
    window.__WP_STATUS = 'ok';
    const gl = r.gl;
    setInterval(() => {
      try {
        const w = 160, h = 90;
        const x = Math.max(0, (r.canvas.width - w) >> 1), y = Math.max(0, (r.canvas.height - h) >> 1);
        const px = new Uint8Array(w * h * 4);
        gl.readPixels(x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
        let sum = 0;
        for (let i = 0; i < w * h; i++) sum += (0.2126*px[i*4] + 0.7152*px[i*4+1] + 0.0722*px[i*4+2]) / 255;
        window.__LUMA = sum / (w * h);
      } catch(e){}
    }, 600);
  } catch(e){ window.__WP_STATUS = 'error: ' + (e.message || e); }
};
s.onerror = () => window.__WP_STATUS = 'error: script load failed';
document.body.appendChild(s);
</script>
</body></html>
